name: Release

# Push a tag such as v0.3.0 to build a release APK and publish it as a GitHub Release.
# Optional repository secrets sign the APK with your own key; without them the public dev key is used
# (fine for testing, not for distribution — see docs/RELEASING.md):
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "LUNA_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "LUNA_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "LUNA_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "LUNA_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key configured: signing with the public dev key."
          fi
      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "luna-browser-${GITHUB_REF_NAME}.apk"
      - name: Keep the Play bundle (unpublished, Play re-signs it - see docs/PUBLISHING.md)
        uses: actions/upload-artifact@v7
        with:
          name: luna-browser-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "luna-browser-${GITHUB_REF_NAME}.apk" --generate-notes --title "Luna Browser $GITHUB_REF_NAME"
