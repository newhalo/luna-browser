name: Feature request
description: Suggest an improvement for TV browsing
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation on the couch — what is hard or impossible with a remote today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Luna to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
